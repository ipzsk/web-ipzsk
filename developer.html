<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发者中心 · IPZSK</title><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/developer.css"><link rel="stylesheet" href="/site-nav.css"><script type="module" src="/site-nav.js"></script><script type="module" src="/developer.js"></script></head><body><header class="site-header" data-site-nav></header><main class="developer-main"><header><div><p class="eyebrow">IPZSK / DEVELOPERS</p><h1>开发者中心</h1></div><a class="secondary" href="/account">个人账户</a></header><p id="notice" role="status"></p><section id="gate" class="card" hidden></section><div id="workspace" hidden><section class="developer-toolbar"><div><h2 id="greeting">我的插件</h2><p>管理发布，查看使用与收益。</p></div><button id="refresh" class="secondary">刷新</button></section><section class="card"><div class="card-heading"><h2>我的插件与版本</h2></div><div id="plugins" class="table-wrap"></div><details><summary>＋ 创建插件</summary><form id="create"><label>插件标识<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="80"></label><label>显示名称<input name="name" required maxlength="100"></label><label>GitHub 仓库（owner/repo）<input name="repository" required maxlength="200"></label><label>npm 包名<input name="package_name" required maxlength="214"></label><button class="primary">创建</button></form></details></section><dialog id="releases" class="plugin-dialog"></dialog><section class="card"><div class="card-heading"><h2>收益</h2></div><form id="filter" class="filters"><label>从<input type="date" name="from" required></label><label>至<input type="date" name="to" required></label><label>插件<select name="plugin_id" id="plugin-filter"><option value="">全部</option></select></label><button class="primary">查询</button></form><div id="usage" class="table-wrap"></div><p class="footnote">我的收益按用户实际扣款与约定比例计算，尚未结算打款。</p></section></div></main></body></html>
