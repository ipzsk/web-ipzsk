      <h1>生视频</h1>

      <article><span>提示 01</span><strong>先写动作，再写镜头</strong><p>主体做什么、镜头怎么移动、光线和氛围如何，描述越具体越稳定。</p></article>
      <article><span>提示 02</span><strong>短片先从 5 秒开始</strong><p>短时长更适合验证构图与动作，满意后再增加时长和清晰度。</p></article>
      <article><span>当前能力</span><strong>仅支持文生视频</strong><p>参考图与图生视频尚未开放，页面不会上传你的本地图片。</p></article>
    </section>
